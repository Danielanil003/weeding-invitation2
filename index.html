<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anil ❤️ Subhalaxmi | Wedding Invitation</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     WELCOME SCREEN
========================== -->
<section id="welcome">

    <div class="overlay"></div>

    <div class="welcome-content">

        <div class="envelope">

            <div class="envelope-flap"></div>

            <div class="letter">

                <h3>Together with their Families</h3>

                <h1>Anil <span>&</span> Subhalaxmi</h1>

                <p>
                    Request the honour of your presence
                    at their wedding celebration.
                </p>

                <button id="openInvitation">
                    Open Invitation
                </button>

            </div>

        </div>

    </div>

</section>


    <!-- =========================
         HERO SECTION
    ========================== -->
    <section id="hero">

        <div class="hero-content">

            <h1>Anil ❤️ Subhalaxmi</h1>

            <p>07 July 2030</p>

            <p>Kedarnath Temple, Uttarakhand</p>

        </div>

    </section>



    <!-- Countdown -->
    <section id="countdown">

        <h2>Countdown to Our Big Day</h2>

        <div class="timer">

            <div class="box">Days</div>

            <div class="box">Hours</div>

            <div class="box">Minutes</div>

            <div class="box">Seconds</div>

        </div>

    </section>



    <!-- Our Story -->
    <section id="story">

        <h2>Our Story</h2>

    </section>



    <!-- Wedding Events -->
    <section id="events">

        <h2>Wedding Events</h2>

    </section>



    <!-- Gallery -->
    <section id="gallery">

        <h2>Gallery</h2>

    </section>



    <!-- Venue -->
    <section id="venue">

        <h2>Venue</h2>

    </section>



    <!-- RSVP -->
    <section id="rsvp">

        <h2>RSVP</h2>

    </section>



    <!-- Thank You -->
    <section id="thankyou">

        <h2>Thank You</h2>

    </section>



    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
